<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>log() — 새 글 쓰기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="noise"></div>

  <header class="topbar">
    <a href="/" class="brand">log<span class="accent">()</span></a>
    <a href="/" class="write-btn">목록으로</a>
  </header>

  <main class="write-wrap">
    <h1 class="write-title">새 글 쓰기</h1>
    <form id="write-form" class="write-form">
      <input type="text" id="f-title" placeholder="제목" required>
      <input type="text" id="f-excerpt" placeholder="한 줄 요약 (목록에 표시됩니다)">
      <input type="text" id="f-tags" placeholder="태그 (쉼표로 구분, 예: llm,ollama)">
      <textarea id="f-content" placeholder="본문을 마크다운으로 작성하세요...&#10;&#10;## 소제목&#10;내용...&#10;&#10;```bash&#10;코드 블록도 됩니다&#10;```" required></textarea>
      <div class="write-actions">
        <button type="submit" class="publish-btn">발행하기</button>
        <span id="write-status" class="write-status"></span>
      </div>
    </form>
  </main>

  <script src="/js/write.js"></script>
</body>
</html>
